name: Controle diário de afiliados
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Verificar links e enviar relatório
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          if [ -n "$GOOGLE_SHEET_CSV_URL" ]; then
            python scripts/verificar_google_sheets.py
          else
            python scripts/verificar_links.py
          fi
      - name: Salvar Excel antigo quando necessário
        if: always()
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          if [ -z "$GOOGLE_SHEET_CSV_URL" ] && [ -f controle/controle_links_afiliados_utilidades_essenciais.xlsx ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add controle/controle_links_afiliados_utilidades_essenciais.xlsx
            if ! git diff --cached --quiet; then
              git commit -m 'chore: atualizar controle de afiliados'
              git push
            fi
          fi
