name: Media availability audit

on:
  schedule:
    - cron: '43 */6 * * *'
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit active media availability without publishing
        shell: bash
        env:
          AUDIT_URL: https://utilidades-essenciais-kappa.vercel.app/api/ci/media-audit
          MEDIA_SHARD: ${{ matrix.shard }}
        run: |
          OIDC_TOKEN="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=utilidades-essenciais-ci" \
            | jq -r '.value'
          )"

          PAYLOAD="$(
            jq -cn --argjson shard "$MEDIA_SHARD" '{shard:$shard}'
          )"

          curl --fail-with-body --silent --show-error \
            -X POST "$AUDIT_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"
