name: Production smoke

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Guard automation contracts
        run: npm run security:contracts

      - name: Verify production navigation and security
        env:
          SMOKE_BASE_URL: https://utilidades-essenciais-kappa.vercel.app
        run: npm run security:smoke

      - name: Verify incident channel authentication
        if: success()
        shell: bash
        env:
          INCIDENT_URL: https://utilidades-essenciais-kappa.vercel.app/api/ci/incident
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=utilidades-essenciais-ci" | jq -r '.value')"
          curl --fail --silent --show-error             -X POST "$INCIDENT_URL"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{"mode":"probe","sha":"$GITHUB_SHA"}" >/dev/null

      - name: Record production smoke failure
        if: failure()
        shell: bash
        env:
          INCIDENT_URL: https://utilidades-essenciais-kappa.vercel.app/api/ci/incident
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=utilidades-essenciais-ci" | jq -r '.value')"
          curl --fail --silent --show-error             -X POST "$INCIDENT_URL"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{"mode":"incident","sha":"$GITHUB_SHA","run_id":"$GITHUB_RUN_ID","run_attempt":"$GITHUB_RUN_ATTEMPT","failed_step":"production-smoke job"}" >/dev/null
